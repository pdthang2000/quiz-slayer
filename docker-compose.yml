services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quizslayer
      POSTGRES_PASSWORD: quizslayer
      POSTGRES_DB: quizslayer
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quizslayer']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
